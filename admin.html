<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>REPAIR PRO - Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        🔧 REPAIR PRO
    </div>

    <nav>

        <a href="index.html">
            🏠 Website
        </a>

    </nav>

</header>



<!-- ADMIN DASHBOARD -->

<section class="section">

    <h1>🖥️ Admin Booking Dashboard</h1>

    <p class="section-subtitle">
        Manage REPAIR PRO service bookings
    </p>


    <!-- SUMMARY -->

    <div class="why-grid">

        <div>

            <span>📋</span>

            <h3>Total Bookings</h3>

            <h2 id="totalBookings">0</h2>

        </div>


        <div>

            <span>⏳</span>

            <h3>Pending</h3>

            <h2 id="pendingBookings">0</h2>

        </div>


        <div>

            <span>✅</span>

            <h3>Completed</h3>

            <h2 id="completedBookings">0</h2>

        </div>

    </div>


    <!-- SEARCH -->

    <div style="margin:40px auto 20px; max-width:600px;">

        <input
            type="text"
            id="searchBox"
            placeholder="🔍 Search by customer, phone or service..."
            style="
                width:100%;
                padding:15px;
                border:1px solid #ccc;
                border-radius:8px;
                font-size:16px;
            "
        >

    </div>


    <!-- BOOKINGS -->

    <div id="bookingList"></div>


</section>



<footer>

    <h2>🔧 REPAIR PRO</h2>

    <p>
        Home Appliance & Electrical Services
    </p>

    <p>
        📞 6300817838 | 9553409804
    </p>

</footer>



<script>


// ================= LOAD BOOKINGS =================

let bookings =
    JSON.parse(
        localStorage.getItem("repairProBookings")
    ) || [];



// ================= DISPLAY BOOKINGS =================

function displayBookings(list = bookings) {

    const container =
        document.getElementById("bookingList");


    container.innerHTML = "";


    if (list.length === 0) {

        container.innerHTML = `
            <div class="service-card">
                <h3>No Bookings Found</h3>
                <p>
                    New customer bookings will appear here.
                </p>
            </div>
        `;

        updateSummary();

        return;
    }


    // Show newest booking first

    const sorted =
        [...list].reverse();


    sorted.forEach(function(booking) {


        const card =
            document.createElement("div");


        card.className =
            "service-card";


        card.style.textAlign = "left";

        card.style.marginBottom = "20px";


        card.innerHTML = `

            <h3>
                🔧 Booking #${booking.id}
            </h3>

            <hr>

            <p>
                <strong>👤 Customer:</strong>
                ${booking.name}
            </p>

            <p>
                <strong>📞 Phone:</strong>
                ${booking.phone}
            </p>

            <p>
                <strong>🛠️ Service:</strong>
                ${booking.service}
            </p>

            <p>
                <strong>📍 Location:</strong>
                ${booking.location}
            </p>

            <p>
                <strong>📅 Date:</strong>
                ${booking.date}
            </p>

            <p>
                <strong>📝 Problem:</strong>
                ${booking.message || "Not specified"}
            </p>

            <p>
                <strong>🕐 Booking Created:</strong>
                ${booking.createdAt}
            </p>

            <label>
                <strong>Booking Status:</strong>
            </label>

            <select
                onchange="changeStatus(${booking.id}, this.value)"
                style="
                    padding:10px;
                    margin-top:8px;
                    width:100%;
                    border-radius:6px;
                "
            >

                <option
                    ${booking.status === "Pending" ? "selected" : ""}
                >
                    Pending
                </option>

                <option
                    ${booking.status === "Confirmed" ? "selected" : ""}
                >
                    Confirmed
                </option>

                <option
                    ${booking.status === "Completed" ? "selected" : ""}
                >
                    Completed
                </option>

                <option
                    ${booking.status === "Cancelled" ? "selected" : ""}
                >
                    Cancelled
                </option>

            </select>


            <div style="margin-top:15px;">

                <a
                    href="tel:${booking.phone}"
                    class="call-btn"
                    style="display:inline-block;"
                >
                    📞 Call
                </a>


                <a
                    href="https://wa.me/91${booking.phone}"
                    target="_blank"
                    class="main-btn"
                    style="display:inline-block;"
                >
                    💬 WhatsApp
                </a>


                <button
                    onclick="deleteBooking(${booking.id})"
                    style="
                        padding:12px 18px;
                        border:0;
                        border-radius:6px;
                        background:#dc2626;
                        color:white;
                        cursor:pointer;
                    "
                >
                    🗑️ Delete
                </button>

            </div>

        `;


        container.appendChild(card);

    });


    updateSummary();

}



// ================= STATUS =================

function changeStatus(id, newStatus) {

    bookings =
        bookings.map(function(booking) {

            if (booking.id === id) {

                booking.status = newStatus;

            }

            return booking;

        });


    localStorage.setItem(
        "repairProBookings",
        JSON.stringify(bookings)
    );


    displayBookings();

}



// ================= DELETE =================

function deleteBooking(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this booking?"
        );


    if (!confirmDelete) {

        return;

    }


    bookings =
        bookings.filter(function(booking) {

            return booking.id !== id;

        });


    localStorage.setItem(
        "repairProBookings",
        JSON.stringify(bookings)
    );


    displayBookings();

}



// ================= SEARCH =================

document
.getElementById("searchBox")
.addEventListener("input", function() {

    const search =
        this.value.toLowerCase();


    const filtered =
        bookings.filter(function(booking) {

            return (

                booking.name
                    .toLowerCase()
                    .includes(search)

                ||

                booking.phone
                    .includes(search)

                ||

                booking.service
                    .toLowerCase()
                    .includes(search)

                ||

                booking.location
                    .toLowerCase()
                    .includes(search)

            );

        });


    displayBookings(filtered);

});



// ================= SUMMARY =================

function updateSummary() {

    document.getElementById("totalBookings")
        .textContent = bookings.length;


    document.getElementById("pendingBookings")
        .textContent =
        bookings.filter(
            b => b.status === "Pending"
        ).length;


    document.getElementById("completedBookings")
        .textContent =
        bookings.filter(
            b => b.status === "Completed"
        ).length;

}



// ================= START =================

displayBookings();

</script>


</body>

</html>
